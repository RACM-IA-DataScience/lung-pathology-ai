[theme]
base = "dark"
primaryColor = "#00f0ff"
backgroundColor = "#070b14"
secondaryBackgroundColor = "#0f172a"
textColor = "#f8fafc"
font = "sans serif"

[browser]
gatherUsageStats = false

[server]
headless = true
enableCORS = false
enableXsrfProtection = false
address = "0.0.0.0"
maxUploadSize = 25
